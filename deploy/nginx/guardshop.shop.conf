# nginx vhost for guardshop.shop -> DeepSeek Harness web UI.
#
# TLS terminates on 9443, not 443: the Remnawave VPN node (rw-node, host
# networking) already owns 443 on this box. Taking 443 here would drop every
# existing VPN client.
#
# Requires the $connection_upgrade map from upgrade-map.conf.

server {
    listen 80;
    listen [::]:80;
    server_name guardshop.shop www.guardshop.shop;

    # Kept unauthenticated and ahead of the redirect so certbot's HTTP-01
    # renewal can always complete.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host:9443$request_uri;
    }
}

server {
    listen 9443 ssl http2;
    listen [::]:9443 ssl http2;
    server_name guardshop.shop www.guardshop.shop;

    ssl_certificate     /etc/letsencrypt/live/guardshop.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guardshop.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # The harness ships no auth of its own and exposes shell/filesystem tools,
    # so the proxy is the only thing standing between it and the internet.
    auth_basic "guardshop.shop restricted";
    auth_basic_user_file /etc/nginx/.htpasswd-dsh;

    client_max_body_size 64m;

    # Browsers fetch the PWA manifest without credentials, so basic auth
    # would 401 it. It is static app metadata (name/icons), no secrets.
    location = /manifest.webmanifest {
        auth_basic off;
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host:9443;
    }

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host:9443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Agent turns stream for a long time; short timeouts cut them off.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
}
